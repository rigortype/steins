# Steins — GitHub Actions workflow (with inline annotations).
#
# Copy to .github/workflows/steins.yml. Same install as github-actions.yml;
# the check step emits `--format github`, so each finding becomes a GitHub
# Actions workflow command (`::error file=...,line=...,col=...,title=...::message`)
# and the runner renders it as an inline annotation on the diff.
#
# The flag is spelled out here for clarity, but it is not required: with no
# `--format`, `check` selects `github` on its own when GITHUB_ACTIONS is set
# (an explicit --format always wins). Escaping is handled in both of
# GitHub's registers. See docs/user-manual/06-ci.md.
#
# Run from the repo root with a relative path — that is what GitHub matches
# annotations against.
name: steins

on: [push, pull_request]

jobs:
  steins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - run: composer require --dev typedduck/steins

      - name: steins check (annotated)
        run: vendor/bin/steins check --format github .

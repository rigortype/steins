# Rows the arm-wise countersign refuses, verbatim:
# name = [functionMap row, engine `getReturnType()` rendering].
# The test is arm-wise subsumption in BOTH directions. A row may REFINE every
# arm the engine declares (`non-empty-string` under `string` stands, and that
# is the reach this table exists for); it may not INVENT an arm the engine
# excludes, and it may not DROP one the engine declares — a `string` over the
# engine's `?string` hides a null, an `int` over `int|false` hides the failure
# arm. These are exactly the silent-rot cases ADR-0014 warns about, caught by
# machinery at generation time (ADR-0069 §3).
[exclusions.reflection_disagree]
"cli_get_process_title" = ["string", "?string"]
"curl_multi_strerror" = ["string", "?string"]
"curl_share_strerror" = ["string", "?string"]
"curl_strerror" = ["string", "?string"]

# Builtin DECLARED RETURN TYPES — the ADR-0069 Asserted floor's data.
#
# SOURCE OF RECORD. Generated by `cargo xtask mine-function-map`, which runs
# `mine_function_map.php` against a pinned phpstan-src checkout and then makes
# the real PHP sidecar countersign every surviving row. Regenerate alongside a
# `PINNED_PHP` bump, the way `hierarchy.toml` is regenerated — never by hand.
#
# LINEAGE (see the root NOTICE file):
#   Steins <- phpstan-src `resources/functionMap.php`
#              (MIT, Copyright (c) Ondrej Mirtes and contributors)
#          <- Phan `src/Phan/Language/Internal/FunctionSignatureMap.php`
#              (MIT, Copyright (c) 2015 Rasmus Lerdorf,
#                   Copyright (c) 2015 Andrew Morrison)
#
# GRADE: every row here is Asserted, never Verified (ADR-0069 §2). It seeds the
# dump surface and contracts-tier reasoning; it is never a proof-layer premise.
# It fires per NAME, wherever the engine's reflected envelope is silent —
# `--no-php` is only the total case; an unloaded extension or a builtin with no
# declared return type is the per-name one. Where the engine answers, it wins.

[meta]
phpstan_src_commit = "dcde2be6ca3caae0e0d4bee6bfbc9fd39ea560e7"
crosscheck_php = "8.5.8"
miner = "docs/research/phpstan-mining/mine_function_map.php"
generator = "cargo xtask mine-function-map"

# total_keys           functionMap entries at the pin, after the delta ladder
# methods_skipped      `Class::method` rows — the floor is function-keyed, and
#                      methods stay OUT of this slice entirely
# alternates_disagree  names whose alternate signatures state different returns
# not_lowerable        rows the declared-contract arm lane cannot carry, by
#                      reason (below), classified on the LOWERED TOP-LEVEL shape
# reflection_disagree  rows the arm-wise countersign refuses
# reflection_missing   names the pinned engine does not know as functions
# engine_typeless      admitted rows where the engine declares NO return type
#                      (the rows where the map genuinely adds reach)
# admitted             rows emitted into the shipped table
# admitted_rich        of those, the rows RICHER than a single-base envelope —
#                      the `T|false` failure unions and the scalar refinements
#                      issue #79 admitted, and the array-vocabulary rows
#                      ADR-0071 admitted (the #73 slice counted and dropped
#                      every one of them)
#
# WHAT IS STILL DEFERRED (ADR-0069 §5 as amended 2026-08-01): `methods_skipped`
# and the object / void / unparseable buckets. Object, `callable` and `resource`
# arms have no extensional denotation — `subsumes_class` is a reflexive floor
# and steins-contract carries no hierarchy — so the countersign could only
# answer `Maybe`, and a row entering uncountersigned is the one thing ADR-0069
# §3 refuses. ADR-0071 §2.3 routes them through a later slice. Nothing here is
# lost data; it is deferred data, counted so the deferral stays visible.
#
# The ARRAY bucket is emptied by ADR-0071: `subsumes` gained a structural
# denotation for `array` / `list<T>` / `array<K, V>` / `array{…}`, so the
# countersign is a real question for a shaped row rather than a vacuous
# `Maybe`. The union and refinement buckets hold only their RESIDUE — a union
# with an object or `mixed` arm, a string whose only spelling is the opaque
# form. The object, void and unparseable buckets read exactly as they did
# at #73.
[counts]
total_keys = 12461
methods_skipped = 6658
alternates_disagree = 18
not_lowerable = 1352
not_lowerable_shaped_arrays = 0
not_lowerable_multi_base_unions = 287
not_lowerable_scalar_refinements = 2
not_lowerable_object_or_resource = 620
not_lowerable_void_never_mixed = 139
not_lowerable_unparseable = 304
reflection_disagree = 55
reflection_missing = 2682
engine_typeless = 22
admitted = 1606
admitted_rich = 687

# The admitted rows: lowercased builtin name -> canonical phpdoc spelling.
# The consumer re-lowers this string through the SAME `lower_str` ->
# `flatten_arms` seam a PROJECT function's declared return takes (issue #60),
# and seeds the resulting arms Asserted — one lowering, two provenances
# (ADR-0069 §2). The spelling is `spell_arms` over the lowered arms and is
# verified at generation time to re-lower to the arms that were countersigned.

# The A11-shaped change oracle: names whose RETURN type moves between two
# adjacent supported minors, keyed to the minor it moved AT. A project whose
# declared PhpTarget is not wholly at or above that minor declines the row
# (an unknown target admits — the row is Asserted anyway, ADR-0069 §3).
# A name that merely APPEARS at a minor is an existence fact, which this
# table never speaks to.
[version_sensitive]
"gc_status" = "8.3"  # changed at: 8.3
"opcache_get_configuration" = "8.3"  # changed at: 8.3
"session_get_cookie_params" = "8.5"  # changed at: 8.5
"str_split" = "8.2"  # changed at: 8.2


#                      `resource` (in any of their alternate signatures)
# migrated_functions   of those, the ones the engine declares a CLASS for (the `from` lists)
# classes              distinct classes those declarations name (the `[[class]]` rows)
# declined             functions contributing no class, by reason (`[declined]` below):
# declined_unloaded      the engine does not have the function (an unloaded
#                        extension — its class is unknown to this engine, and
#                        ADR-0056 §8.2's condition 2 refuses the producer row too)
# declined_typeless      the engine declares NO return type — still a resource,
#                        the producers the §8.2 gate admits
# declined_no_class      the engine declares a type that names no class

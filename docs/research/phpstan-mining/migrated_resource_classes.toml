# Builtin RESOURCE-TO-OBJECT MIGRATIONS — the ADR-0097 §2.6 migrated-class table.
#
# SOURCE OF RECORD, DERIVED. Generated by `cargo xtask mine-function-map
# --migrated`; never hand-edited. It is a by-product of the countersign that
# builds `declared_returns.toml`, read at THAT table's pin: every function
# whose return type functionMap spells with `resource`, asked of the real PHP
# sidecar, and the classes the engine declares there instead. Regenerate
# alongside `declared_returns.toml`, never on its own pin.
#
# WHICH MAP. The BASE `functionMap.php`, before the per-minor delta ladder —
# deliberately the opposite of `declared_returns.toml`, which reads the
# ladder's end. The deltas are where PHPStan catches up row by row (at the
# pin `functionMap_php80delta.php` already says `CurlHandle|false` for
# `curl_init` and `GdImage|false` for every `imagecreate*`, while
# `curl_copy_handle` still says `resource`), and the channel this table bounds
# is per CLASS, not per row: a `@param resource $ch` receives a `CurlHandle`
# from either function. The base map is the map for the oldest PHP PHPStan
# supports — the last record of what returned a resource before PHP 8 migrated
# it — and it is a measured superset of every rung (nothing any delta adds
# spells `resource`). A class leaves this table when the resource era leaves
# the base map, i.e. when PHPStan drops the PHP that returned it.
#
# WHY IT EXISTS. PHP 8 has turned a family of handles into objects per release
# (`curl_init` → `CurlHandle`, the `imagecreate*` family → `GdImage`, `ldap_*` →
# `LDAP\Connection`, …) and left a decade of `@param resource $ch` docblocks
# on parameters that now receive those objects. ADR-0056 §8.5 protected that
# channel by refusing EVERY object against `@param resource`; ADR-0097 §2.6
# makes the channel finite. An object of a class below stays `Maybe` — the
# docblock is the suspect — and an object of any other class is a genuine
# docblock violation: `new \stdClass()` convicts, as it does under every other
# analyzer on the conformance page.
#
# RETIREMENT IS THE DESIGN (ADR-0097 §2.8). A class enters while functionMap
# lags the engine and leaves when the map catches up — at which point `@param
# resource` handed that class is rot the docblock's own vocabulary has
# abandoned, and PHPStan reports it too. Nothing here is hand-listed.
#
# LINEAGE (see the root NOTICE file):
#   Steins <- phpstan-src `resources/functionMap.php`
#              (MIT, Copyright (c) Ondrej Mirtes and contributors)
#          <- Phan `src/Phan/Language/Internal/FunctionSignatureMap.php`
#              (MIT, Copyright (c) 2015 Rasmus Lerdorf,
#                   Copyright (c) 2015 Andrew Morrison)


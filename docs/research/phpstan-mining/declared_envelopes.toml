# Builtin declared-return ENVELOPES — the ADR-0069 Asserted floor's data.
#
# SOURCE OF RECORD. Generated by `cargo xtask mine-function-map`, which runs
# `mine_function_map.php` against a pinned phpstan-src checkout and then makes
# the real PHP sidecar countersign every surviving row. Regenerate alongside a
# `PINNED_PHP` bump, the way `hierarchy.toml` is regenerated — never by hand.
#
# LINEAGE (see the root NOTICE file):
#   Steins <- phpstan-src `resources/functionMap.php`
#              (MIT, Copyright (c) Ondrej Mirtes and contributors)
#          <- Phan `src/Phan/Language/Internal/FunctionSignatureMap.php`
#              (MIT, Copyright (c) 2015 Rasmus Lerdorf,
#                   Copyright (c) 2015 Andrew Morrison)
#
# GRADE: every row here is Asserted, never Verified (ADR-0069 §2). It seeds the
# dump surface and contracts-tier reasoning; it is never a proof-layer premise.
# It fires per NAME, wherever the engine's reflected envelope is silent —
# `--no-php` is only the total case; an unloaded extension or a builtin with no
# declared return type is the per-name one. Where the engine answers, it wins.

[meta]
phpstan_src_commit = "dcde2be6ca3caae0e0d4bee6bfbc9fd39ea560e7"
crosscheck_php = "8.5.8"
miner = "docs/research/phpstan-mining/mine_function_map.php"
generator = "cargo xtask mine-function-map"

# total_keys           functionMap entries at the pin, after the delta ladder
# methods_skipped      `Class::method` rows — the floor is function-keyed, and
#                      methods stay OUT of this slice entirely
# alternates_disagree  names whose alternate signatures state different returns
# not_lowerable        rows richer than the envelope lowering, by reason (below)
# reflection_disagree  rows the pinned engine's own declaration escapes
# reflection_missing   names the pinned engine does not know as functions
# engine_typeless      admitted rows where the engine declares NO return type
#                      (the rows where the map genuinely adds reach)
# admitted             rows emitted into the shipped table
#
# THE TWO NUMBERS THAT SIZE THE NEXT SLICE (ADR-0069 §5): `methods_skipped`
# and the `not_lowerable_*` array/union buckets. Those are the rows where
# functionMap genuinely exceeds what reflection can say — shaped arrays and
# `T|false` failure unions, plus every method row — and they await a
# contracts-grade Asserted slice that seeds through the FULL `lower_str`
# lowering rather than `envelope_fact`. Nothing here is lost data; it is
# deferred data, counted so the deferral stays visible.
[counts]
total_keys = 12461
methods_skipped = 6658
alternates_disagree = 18
not_lowerable = 2644
not_lowerable_shaped_arrays = 388
not_lowerable_multi_base_unions = 1119
not_lowerable_scalar_refinements = 74
not_lowerable_object_or_resource = 620
not_lowerable_void_never_mixed = 139
not_lowerable_unparseable = 304
reflection_disagree = 33
reflection_missing = 2099
engine_typeless = 10
admitted = 919


# Alternate signatures that state DIFFERENT return types for one name: a floor
# row must state one envelope, so the name is excluded outright.
[exclusions.alternates_disagree]
"apc_add" = ["array", "bool"]
"apc_exists" = ["array", "bool"]
"apc_store" = ["array", "bool"]
"apcu_add" = ["array<string,int>", "bool"]
"apcu_delete" = ["bool", "list<string>"]
"apcu_exists" = ["array", "bool"]
"apcu_store" = ["array", "bool"]
"array_rand" = ["int|string", "int|string|array<int,int>|array<int,string>"]
"base64_decode" = ["string", "string|false"]
"getenv" = ["array<string, string>", "string|false"]
"ibase_blob_open" = ["resource", "resource|false"]
"mb_detect_order" = ["bool", "list<non-falsy-string>"]
"phpversion" = ["string", "string|false"]
"snmp2_get" = ["array<string,string>|false", "string|false"]
"snmp3_get" = ["array<string,string>|false", "string|false"]
"snmpget" = ["array<string,string>|false", "string|false"]
"sscanf" = ["array|null", "int|null"]
"version_compare" = ["__benevolent<bool|null>", "int|bool"]

# Rows the pinned engine's own declaration escapes, verbatim:
# name = [functionMap envelope, engine `getReturnType()` rendering].
# The test is subsumption, not equality — an envelope is an upper bound, so
# a coarser row over a narrower engine type is admitted, and only a row the
# engine's declaration can step outside of lands here. These are exactly the
# silent-rot cases ADR-0014 warns about, caught by machinery at generation
# time (ADR-0069 §3).
[exclusions.reflection_disagree]
"cli_get_process_title" = ["string", "?string"]
"curl_multi_strerror" = ["string", "?string"]
"curl_share_strerror" = ["string", "?string"]

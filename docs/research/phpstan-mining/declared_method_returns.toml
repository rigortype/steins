# Rows the engine declares `mixed` for. `mixed` subsumes everything, so the
# arm-wise countersign would pass ANY row against it — the check degenerates
# into no check. `directoryiterator::key` is the witness: the map says
# `string`, `Iterator::key(): mixed` says nothing, PHP returns `int(0)`.
engine_mixed = [
  "directoryiterator::current",
  "directoryiterator::key",
  "domxpath::query",
  "intliterator::key",
  "intlpartsiterator::current",
  "pdostatement::fetchcolumn",
  "recursivetreeiterator::current",
  "recursivetreeiterator::key",
  "sqlite3::querysingle",
]

# Alternate signatures that state DIFFERENT return types for one key: a floor
# row must state one type, so the key is excluded outright.
[exclusions.alternates_disagree]
"memcache::get" = ["mixed", "mixed[]|false"]
"memcachepool::get" = ["mixed", "mixed[]|false"]
"redis::blpop" = ["__benevolent<Redis|mixed[]|null|false>", "array"]
"redis::brpop" = ["__benevolent<Redis|mixed[]|null|false>", "array"]
"redis::del" = ["__benevolent<Redis|int|false>", "int"]
"redis::delete" = ["__benevolent<Redis|int|false>", "int"]
"redis::exists" = ["__benevolent<Redis|int|bool>", "int"]
"redis::set" = ["__benevolent<Redis|string|bool>", "bool"]
"redis::unlink" = ["__benevolent<Redis|0|positive-int|false>", "int"]
"redis::zadd" = ["__benevolent<Redis|int|float|false>", "int"]
"snmp::get" = ["array<string,string>|false", "string|false"]
"snmp::getnext" = ["array<string,string>|false", "string|false"]


"directoryiterator::getsize" = ["reflection_disagree", "splfileinfo"]
"directoryiterator::gettype" = ["reflection_disagree", "splfileinfo"]
"parentiterator::valid" = ["not_lowerable", "filteriterator"]
"pdoexception::getfile" = ["not_lowerable", "runtimeexception"]
"pdoexception::getline" = ["not_lowerable", "runtimeexception"]

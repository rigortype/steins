# Builtin DECLARED METHOD RETURN TYPES — the ADR-0069 Asserted floor's data,
# keyed `class::method` (issue #673).
#
# SOURCE OF RECORD. Generated by `cargo xtask mine-function-map --methods`,
# which runs `mine_function_map.php` against a pinned phpstan-src checkout and
# then makes the real PHP sidecar countersign every surviving row through
# `reflect_class`. Regenerate alongside a `PINNED_PHP` bump, never by hand.
#
# LINEAGE (see the root NOTICE file):
#   Steins <- phpstan-src `resources/functionMap.php`
#              (MIT, Copyright (c) Ondrej Mirtes and contributors)
#          <- Phan `src/Phan/Language/Internal/FunctionSignatureMap.php`
#              (MIT, Copyright (c) 2015 Rasmus Lerdorf,
#                   Copyright (c) 2015 Andrew Morrison)
#
# GRADE: every row here is Asserted, never Verified (ADR-0069 §2), and the
# object-returning rows ride ADR-0093 §3.1's sourcing rule — a mined declared
# return IS a declaration, which is what lets a class arm into the contract
# lane at all. functionMap is not a native stub, so no row is ever Verified:
# a builtin has no `@return` docblock to promote from, and the map's own word
# is exactly the unconfirmed claim the Asserted lane exists for.
#
# WHERE IT SPEAKS: at a method or static call whose receiver is a BUILTIN
# class by declaration, after the project chain has answered nothing. A
# project class that extends a builtin keeps its own declaration on every
# name it declares; this table answers only the inherited names.
#
# NO COUNTERSIGN, NO ROW — and unlike the function half, that includes the
# two SILENT countersigns. A row the engine declares no return type for, and
# a row it declares `mixed` for, are both refused here and listed under
# `[exclusions]`. The function table admits them because ADR-0056's reflected
# envelope is a rung ABOVE it at analysis time and corrects it per name;
# nothing sits above this table, and the consuming walk hands a row to every
# DESCENDANT on a covariance argument (ADR-0049 A16) that only a native,
# non-`mixed` envelope can make.

[meta]
phpstan_src_commit = "dcde2be6ca3caae0e0d4bee6bfbc9fd39ea560e7"
crosscheck_php = "8.5.10"
miner = "docs/research/phpstan-mining/mine_function_map.php"
generator = "cargo xtask mine-function-map --methods"

# keys                 `Class::method` entries at the pin, after the delta ladder
# alternates_disagree  keys whose alternate signatures state different returns
# not_lowerable        rows the declared-contract arm lane cannot carry, by
#                      reason (below), classified on the LOWERED TOP-LEVEL shape
# class_missing_*      rows whose CLASS the pinned engine does not have (an
#                      extension this build does not load), and how many distinct
#                      classes those rows name
# method_missing       rows whose class the engine has WITHOUT the method — the
#                      drift bucket, distinct from the extension-set one above
# reflection_disagree  rows the arm-wise countersign refuses
# engine_untyped       rows REFUSED because the engine declares no return type
# engine_mixed         rows REFUSED because the engine declares `mixed`
# blocked              refused keys whose ancestor carries a row for the same
#                      method — the walk stops at them instead of inheriting
# admitted             rows emitted into the shipped table
# admitted_static      of those, the ones the engine declares `static`
# admitted_rich        of those, the rows RICHER than a single-base envelope
#
# PROPERTIES ARE NOT HERE, and their absence is the source's, not a filter's:
# functionMap's key grammar has no spelling for a property, so the vendor and
# builtin property reads issue #673 counts alongside the method rows have no
# mining source at all. A property table would need a different source and a
# different countersign — `ReflectedProperty` carries a name, a static bit and
# a visibility, and no type.
#
# WHAT IS EXCLUDED, and why it is the same list the function half excludes:
# `callable`, the intersections, `resource` and `void` have no extensional
# denotation `subsumes` could use, so the countersign could only answer
# `Maybe` — which ADR-0069 §3 refuses. Class and bare-`object` arms are NOT
# excluded: `subsumes_class` is reflexive, so a row naming the class the
# engine names countersigns on that alone, and a row naming a DIFFERENT one
# stays `Maybe` and is refused. That reflexive floor is what keeps the stale
# rows out while admitting `DOMDocument::getElementById` = `?DOMElement`.
[counts]
keys = 6658
alternates_disagree = 12
not_lowerable = 1687
not_lowerable_shaped_arrays = 0
not_lowerable_multi_base_unions = 15
not_lowerable_scalar_refinements = 0
not_lowerable_object_or_resource = 1127
not_lowerable_void_never_mixed = 218
not_lowerable_unparseable = 327
class_missing_rows = 3593
class_missing_classes = 325
method_missing = 68
reflection_disagree = 225
engine_untyped = 67
engine_mixed = 9
blocked = 25
admitted = 957
admitted_static = 82
admitted_rich = 305

# The admitted rows: lowercased `class::method` -> [canonical phpdoc spelling,
# whether the ENGINE declares the method static]. The consumer re-lowers the
# spelling through the same `lower_str` -> `flatten_arms` seam a project
# method's declared return takes, and seeds the resulting arms Asserted. The
# key is where functionMap puts the row, which may be a SUBCLASS of the class
# that declares the method; the consuming lookup walks the builtin hierarchy
# (ADR-0043) so a row on a parent answers for a child receiver too — the
# parent's NATIVE, NON-`mixed` engine envelope is an upper bound on every
# override under covariance (ADR-0049 A16), which is why a row the engine
# could not countersign never reaches this section, and why `[blocked]` below
# stops the walk at a child functionMap states differently.
# Where a row NAMES A CLASS, or `spell_arms` declines the arms outright, it
# keeps functionMap's OWN string, which lowers back to the countersigned arms
# by construction and preserves the class's source casing.

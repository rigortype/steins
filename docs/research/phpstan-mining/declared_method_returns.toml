# The A11-shaped change oracle, keyed the same way: `class::method` entries
# whose RETURN type moves between two adjacent supported minors, keyed to the
# minor it moved AT. A project whose declared PhpTarget is not wholly at or
# above that minor declines the row; an unknown target admits.
[version_sensitive]
"dateinterval::createfromdatestring" = "8.3"  # changed at: 8.3
"datetime::modify" = "8.3"  # changed at: 8.3
"datetimeimmutable::modify" = "8.3"  # changed at: 8.3

# SHADOWS. The consuming walk climbs `builtin_class_supers` and reads "no row
# on the child" as "inherit the ancestor's" — but only 1 key in 7 became a
# row, so that reading is wrong wherever functionMap STATES the child and this
# miner dropped or refused it. Such a key is positive evidence that the
# nearest declaration is not the ancestor's, so it BLOCKS the walk: a receiver
# of that class, or of any class between it and the row-bearing ancestor,
# answers nothing at all. Listed only where an ancestor actually carries a row
# for the same method, which is what keeps the table short.
# key = [why the key was refused, the nearest ancestor whose row it shadows].
# `pdoexception::getcode` is the live witness: functionMap states it as `['']`,
# which is unparseable, and without this table the walk would reach
# `runtimeexception::getcode` and answer `int` where PHP returns `"HY000"`.
[blocked]
"arrayobject::getiterator" = ["reflection_disagree", "iteratoraggregate"]
"directoryiterator::getatime" = ["reflection_disagree", "splfileinfo"]
"directoryiterator::getgroup" = ["reflection_disagree", "splfileinfo"]
"directoryiterator::getinode" = ["reflection_disagree", "splfileinfo"]
"directoryiterator::getlinktarget" = ["reflection_disagree", "splfileinfo"]
"directoryiterator::getmtime" = ["reflection_disagree", "splfileinfo"]

# resource_params.toml — builtin POSITIONS that demand a legacy PHP RESOURCE
# (ADR-0097 §2.5, the parameter twin of resource_returns.toml).
#
# SOURCE OF RECORD. Generated by `cargo xtask mine-resource-params`, which scans
# every `*.stub.php` of a pinned php-src checkout for a docblock `@param` whose
# type is EXACTLY `resource` on a free function. Regenerate alongside a
# `PINNED_PHP` bump, the way resource_returns.toml is re-read — never by hand.
# `cargo xtask gen-catalog` emits crates/steins-catalog/src/resource_params_generated.rs.
#
# ─────────────────── Why a table, and why the stubs ───────────────────
# Every other builtin parameter is judged against the REFLECTED signature — the
# running engine's own `getParameters()` (ADR-0056 §9). PHP has no syntax for a
# `resource` parameter, so reflection reports NO type at every one of these
# positions, and the engine checks at the call instead: `fwrite('x', …)` is
# `TypeError: fwrite(): Argument #1 ($stream) must be of type resource, string
# given`, in either coercion mode. The stub docblock is the only place the
# demand is written down, and this table is that reading at the pin.
#
# ADMISSION is ADR-0056 §8.2's gate in the parameter direction, all three
# conditions checked at the call site and none of them here:
#   1. the stub at the pin says `resource` (this table IS that reading);
#   2. the analyzing engine declares NO type at the position — THE TRIPWIRE:
#      the day `fwrite` declares `Stream $stream`, the engine speaks and the
#      row is disowned, with no re-mining and no staleness window;
#   3. the project PHP minor equals `steins_catalog::PINNED_PHP`.
#
# ─────────────────── Two kinds of column ───────────────────
# MECHANICAL (the scan's, rewritten on every run): `function` (lowercased;
# namespaced names keep their `\`), `index` (0-based position), `name` (the
# `$param`, so a finding can name it the way PHP's TypeError does), `stub`.
# A position is a row only when the stub declares it untyped, by value, not
# variadic, and with no `null` default; anything else is DECLINED below.
#
# CURATED (carried forward from the committed file by (function, index), never
# invented, refused when orphaned): `accepts_closed` (the position answers on a
# closed handle; default false), `closes` (the call leaves its argument closed;
# default false), `kind` (the resource kind the position demands — `stream`,
# `dir`, `process`, `stream-context`; absent unless probed), `probe` (the
# verbatim `php -r` transcript that established the curated bits). Nothing is
# recalled from memory: a row with a `kind` carries its probe, and so does every
# `true` bit. A row with no probe carries only the defaults, which are the
# stub's claim and not a measurement.
#
# ─────────────────── What is deliberately NOT here ───────────────────
# * Union positions (`resource|string`, `resource|null`, `resource|GdImage`):
#   listed under [declined] with their spelling. The ordinary relation judges
#   them once the arms lower; a curated union row would be the parameter
#   refinement ADR-0056 §9.6 refuses.
# * Method positions (`SplFileObject::__construct`'s `resource|string`,
#   `Phar::setStub`): ADR-0056 §4's function-keyed bound, counted as
#   `methods_skipped`.
# * `ext/zend_test` positions: the extension is a debug build's harness and no
#   analyzed project loads it — the same exclusion resource_returns.toml makes.


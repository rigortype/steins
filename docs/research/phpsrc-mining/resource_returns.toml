[[function]]
name = "bzopen"
arms = "resource|false"
stub = "ext/bz2/bz2.stub.php"
confidence = "verified-probe"
probe = "get_debug_type(bzopen(sys_get_temp_dir().'/steins_probe.bz2','w')) === 'resource (stream)'"

[[function]]
name = "socket_export_stream"
arms = "resource|false"
stub = "ext/sockets/sockets.stub.php"
confidence = "verified-probe"
probe = "get_debug_type(socket_export_stream(socket_create(AF_INET, SOCK_STREAM, SOL_TCP))) === 'resource (stream)' — note the ARGUMENT is a Socket object since 8.0 while the RETURN is still a resource, which is the migration's asymmetry in one call"

[[function]]
name = "pg_socket"
arms = "resource|false"
stub = "ext/pgsql/pgsql.stub.php"
confidence = "stub-and-reflection"
probe = "NOT behaviorally probed: needs a live PostgreSQL connection. Evidence is the stub `@return resource|false` at the pin plus ReflectionFunction('pg_socket')->getReturnType() === null on 8.5.9 with ext-pgsql loaded. Its sibling pg_connect DID migrate (PgSql\\Connection), so this row is exactly the case condition 2 exists to keep honest — and condition 2 passes it."

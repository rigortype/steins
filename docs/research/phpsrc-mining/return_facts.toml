# return_facts.toml — curated builtin return-fact REFINEMENTS (ADR-0056)
# php-src commit: 6bc7c26cf67a9480b5ef9d6191aebe87fa931183 (Thu Jul 9 2026)
# Stub types read at that pin; behavioral probes run vs PHP 8.5.8 (cli),
# /opt/homebrew/bin/php. Source of record for `cargo xtask gen-catalog`, which
# emits crates/steins-catalog/src/return_facts_generated.rs.
#
# ─────────────────────────── What a row IS ───────────────────────────
# A row is a CURATED REFINEMENT that beats the reflected return envelope in
# precision. The reflected envelope (the running engine's own `getReturnType()`)
# is seeded WITHOUT a row — the plumbing does that for every builtin whose return
# is a single representable scalar base (ADR-0056 §1, "the envelope machinery
# alone already serves every reflected builtin"). A row is needed ONLY where a
# Refined-layer fact the engine's type system cannot express (`int<0, max>`,
# `non-empty-string`) narrows strictly WITHIN that envelope.
#
# `refinement` is a phpdoc type STRING (e.g. "int<0, max>", "non-empty-string").
# It is admitted at a call site only after the acceptance machinery confirms it is
# an extensional subset of the reflected envelope AND the project PHP minor equals
# steins_catalog::PINNED_PHP (ADR-0056 §2). A stale row can only lose precision,
# never manufacture a wrong premise the runtime disowns.
#
# Every row carries per-row EVIDENCE: the php-src stub `return_type` at the pin,
# and for the refinement a behavioral witness — a `php -r` probe transcript or a
# php-src C citation, recorded verbatim. Nothing is recalled from memory.
#
# ─────────────────────────── R1 measured family ───────────────────────────
# R1 is the bool-predicate family (nsrt differ class `expected:bool | 741`) plus
# the plumbing. For a PURE predicate the reflected envelope IS `bool`, and `bool`
# is already the coarsest value-domain base — there is NO refinement beyond it.
# So R1 lands ZERO curated rows: the entire 741 comes from ENVELOPE SEEDING alone,
# not from this table. The probes below RECORD that finding (reflected == bool for
# each, hence no row), keeping the sourcing discipline honest.
#
# Probe (verbatim), all on /opt/homebrew/bin/php 8.5.8:
#   php -r 'foreach (["array_key_exists","in_array","str_contains","str_starts_with",
#     "str_ends_with","is_int","is_string","is_bool","is_float","is_array","is_null",
#     "is_object","is_callable","is_numeric","property_exists","method_exists",
#     "function_exists","class_exists","ctype_digit","ctype_alpha"] as $fn) {
#       $r = new ReflectionFunction($fn);
#       echo $fn." rt=".((string)($r->getReturnType() ?? "NULL"))."\n"; }'
# Output: every one printed `rt=bool` (getReturnType, non-tentative, non-nullable).
# `getTentativeReturnType` is NULL for all (they carry a real return type).
#
# `isset`/`empty` are language constructs, not functions — no ReflectionFunction,
# no reflected envelope, and guard-position folding already handles them (ADR-0056
# leaves guard-position UNTOUCHED). They are correctly absent here.
#
# Because bool == envelope, the R1 curated table is EMPTY. Later slices add rows
# where refinement is real:
#   R3  count(): int<0, max>        — envelope `int`, refinement `int<0, max>`
#   R4  sha1(): non-empty-string    — envelope `string`, refinement `non-empty-string`
# Those rows land with their own probes when their slices are implemented.

# ─────────────────────────── R3 int-range family ───────────────────────────
# nsrt differ class `int-range | 546`. Reflected envelope is a single `int`
# (verbatim ReflectionFunction::getReturnType, PHP 8.5.8, non-tentative):
#   count int  sizeof int  strlen int  mb_strlen int  substr_count int
#   func_num_args int  array_push int  array_unshift int
# The refinement `int<0, max>` (== non-negative-int) narrows within that `int`
# envelope. Each is argument-INSENSITIVE: it holds for EVERY argument the
# function returns normally on (a throw on bad input is not a return, §4).
# Probe (verbatim, /opt/homebrew/bin/php 8.5.8):
#   count([])=0  count([1,2,3])=3  count(range(1,100000))=100000
#   count([[1,2],[3,4,5]],COUNT_RECURSIVE)=7  sizeof([])=0
#   strlen("")=0  strlen("abc")=3  strlen(chr(0))=1
#   mb_strlen("")=0  mb_strlen("日本")=2
#   substr_count("","x")=0  substr_count("aaa","a")=3  substr_count("abc","z")=0
#   func_num_args()=0  func_num_args(1,2,3)=3
#   array_push($e=[])=0  array_push([],1)=1  array_push([1,2],9,9)=4
#   array_unshift($u=[])=0  array_unshift([9],1,2)=3
# Nothing returned < 0 in any case; the empty-array / no-value edges pin the
# LOWER bound at 0 (not 1) — array_push/array_unshift with no values-to-add
# return the unchanged count, which is 0 for an empty target. So the airtight
# refinement is int<0, max>, never positive-int.

[[function]]
name = "count"
refinement = "int<0, max>"
return_type = "int"
confidence = "verified-probe"
probe = "count([])=0; count([1,2,3])=3; count(range(1,100000))=100000; count([[1,2],[3,4,5]],COUNT_RECURSIVE)=7 — never negative, floor 0 (empty array)."

[[function]]
name = "sizeof"
refinement = "int<0, max>"
return_type = "int"
confidence = "verified-probe"
probe = "sizeof([])=0 — alias of count (php-src ext/standard/basic_functions.stub.php: sizeof === count); same int<0,max>."

[[function]]
name = "strlen"
refinement = "int<0, max>"
return_type = "int"
confidence = "verified-probe"
probe = "strlen(\"\")=0; strlen(\"abc\")=3; strlen(chr(0))=1 — byte length, never negative, floor 0 (empty string). Reflected envelope on 8.5 is plain int (no false arm)."

[[function]]
name = "mb_strlen"
refinement = "int<0, max>"
return_type = "int"
confidence = "verified-probe"
probe = "mb_strlen(\"\")=0; mb_strlen(\"日本\")=2 — code-point count, never negative. Invalid encoding THROWS ValueError on 8.x (not a return), so every normal return is >=0."

[[function]]
name = "substr_count"
refinement = "int<0, max>"
return_type = "int"
confidence = "verified-probe"
probe = "substr_count(\"\",\"x\")=0; substr_count(\"aaa\",\"a\")=3; substr_count(\"abc\",\"z\")=0 — occurrence count, floor 0 (no match / empty haystack), never negative for any args."

[[function]]
name = "func_num_args"
refinement = "int<0, max>"
return_type = "int"
confidence = "verified-probe"
probe = "func_num_args()=0; func_num_args(1,2,3)=3 — count of passed args, floor 0, never negative."

[[function]]
name = "array_push"
refinement = "int<0, max>"
return_type = "int"
confidence = "verified-probe"
probe = "array_push($e=[])=0; array_push([],1)=1; array_push([1,2],9,9)=4 — returns the NEW element count. With no values-to-push on an empty array it returns 0, so floor is 0 (not 1); never negative."

[[function]]
name = "array_unshift"
refinement = "int<0, max>"
return_type = "int"
confidence = "verified-probe"
probe = "array_unshift($u=[])=0; array_unshift([9],1,2)=3 — new element count, floor 0 (no-value on empty), never negative."

# ─────────────────────── R3 refused rows (argument-SENSITIVE) ───────────────────────
# These name int-range-adjacent functions whose REFLECTED envelope is multi-base,
# so envelope_fact() already returns None and no refinement can be seeded. Recorded
# here to preempt a future well-meaning but WRONG row (the ADR's named FP channel):
#
#   str_word_count  rt=array|int   — format 0 returns int>=0, format 1/2 return
#                                     an array. Argument-SENSITIVE (v2 guarded-arm
#                                     territory, ADR-0056 §4); refused in v1.
#   preg_match_all  rt=int|false   — int<0,max>|false. Multi-base (the false arm is
#                                     ADR-0042's authority); no single-Fact seed.
#   abs             rt=int|float   — abs(int) is int<0,max> but abs(float) is float.
#                                     Argument-SENSITIVE, the ADR's canonical v1
#                                     refusal (§4); the envelope int|float already
#                                     beats `unknown`. Refused.

# ─────────────────────────── R4 refined-string family ───────────────────────────
# nsrt differ class `refined-string | 675`. Reflected envelope is a single `string`
# (verbatim getReturnType, 8.5.8): sha1 string  md5 string  uniqid string.
# The refinement `non-falsy-string` (StrPreds NON_FALSY: neither "" nor "0")
# narrows within that `string` envelope. StrPreds vocabulary is NON_EMPTY /
# NON_FALSY / NUMERIC; NON_FALSY is the tightest that holds and is strictly a
# subset of the envelope, so it is what we curate.
# Probe (verbatim, /opt/homebrew/bin/php 8.5.8):
#   sha1("")=da39a3ee5e6b4b0d3255bfef95601890afd80709 (40 hex); sha1("",true) len=20
#   md5("")=d41d8cd98f00b204e9800998ecf8427e (32 hex);          md5("",true) len=16
#   uniqid()=6a63673e90616; uniqid("")=6a63673e9061a (13 chars)
#   (sha1("")==="0")=false; (sha1("")==="")=false
# ARGUMENT-INSENSITIVE argument: a fixed-length digest/id is never the empty string
# and never the single character "0" for ANY input — including the raw-binary modes
# sha1($s,true)/md5($s,true), whose 20-/16-byte outputs are neither "" nor "0" (both
# falsy strings have length <= 1). So NON_FALSY holds for every argument.

[[function]]
name = "sha1"
refinement = "non-falsy-string"
return_type = "string"
confidence = "verified-probe"
probe = "sha1(\"\")=da39a3ee5e6b4b0d3255bfef95601890afd80709 (40 hex chars); sha1(\"\",true) is 20 raw bytes. Never \"\" nor \"0\" for any input ⇒ non-falsy."

[[function]]
name = "md5"
refinement = "non-falsy-string"
return_type = "string"
confidence = "verified-probe"
probe = "md5(\"\")=d41d8cd98f00b204e9800998ecf8427e (32 hex chars); md5(\"\",true) is 16 raw bytes. Never \"\" nor \"0\" for any input ⇒ non-falsy."

[[function]]
name = "uniqid"
refinement = "non-falsy-string"
return_type = "string"
confidence = "verified-probe"
probe = "uniqid()=6a63673e90616; uniqid(\"\")=6a63673e9061a — always >=13 hex chars (a prefix is prepended, never removed). Never \"\" nor \"0\" ⇒ non-falsy for any args."

# ─────────────────── DR4 refined-string extension (ADR-0064 seam iii) ───────────────────
# The final DR slice extends the R4 family with the two candidates whose probes
# survived; the third (`dirname`) was REFUTED and is recorded in the refused table
# below. Reflected envelope for all three is a single `string` (verbatim, 8.5.8):
#   php -r 'foreach (["dirname","get_debug_type","spl_object_hash"] as $fn) {
#     $rf = new ReflectionFunction($fn);
#     printf("%s rt=%s tentative=%s\n", $fn, (string)($rf->getReturnType() ?? "NULL"),
#       (string)($rf->getTentativeReturnType() ?? "NULL")); }'
#   dirname rt=string tentative=NULL
#   get_debug_type rt=string tentative=NULL
#   spl_object_hash rt=string tentative=NULL
# None is deprecated at the pin (ReflectionFunction::isDeprecated() === false for
# all three), so no row rests on a function scheduled for removal.
#
# spl_object_hash probe (verbatim, /opt/homebrew/bin/php 8.5.8):
#   spl_object_hash(new Foo)       = 00000000000000010000000000000000  len=32
#   spl_object_hash(new stdClass)  = 00000000000000020000000000000000  len=32
#   spl_object_hash(function(){})  = 00000000000000030000000000000000  len=32
#   spl_object_hash(new class{})   = 00000000000000040000000000000000  len=32
#   spl_object_hash(new ArrayObject([])) = 00000000000000050000000000000000  len=32
#   5000-object sweep: distinct lengths=32  allhex=true  anyfalsy=false  alllowercase=true
# ARGUMENT-INSENSITIVE argument: the parameter is typed `object`, so there is no
# empty-in path at all — the bin2hex trap (empty in ⇒ empty out) is structurally
# unreachable. Every return is a fixed 32-character lowercase hex digest, so it is
# neither "" nor "0" (both falsy strings have length <= 1) for EVERY argument.
# This mirrors sha1/md5 exactly, including the discipline of curating only
# NON_FALSY: the fixed length and lowercase-hex charset are real but have no
# StrPreds spelling, so they are recorded here as evidence and NOT claimed.
#
# get_debug_type probe (verbatim, /opt/homebrew/bin/php 8.5.8) — the full return-set
# shape, adversarial values first:
#   ""        => 'string'   "0"      => 'string'   0     => 'int'    -1  => 'int'
#   1.5/NAN/INF => 'float'  true/false => 'bool'   null  => 'null'
#   []        => 'array'    [1,2]    => 'array'
#   new Foo   => 'Foo'      new stdClass => 'stdClass'  function(){} => 'Closure'
#   new class{} => 'class@anonymous'
#   enum E{case A;}  E::A   => 'E'    (len 1 — the SHORTEST observed return)
#   enum EB:string{case A="0";} EB::A => 'EB'   (a "0"-BACKED enum still names the class)
#   fopen("php://memory","r") => 'resource (stream)'   after fclose => 'resource (closed)'
# Every return is non-empty and none is "0". The two open-ended arms are checked:
#   - type keywords: 'bool','int','float','string','array','null','resource (stream)',
#     'resource (closed)' — all >= 3 chars.
#   - class/enum/interface names: PHP's label grammar forbids a leading digit, so "0"
#     is not a nameable class. Confirmed: php -r 'var_dump(class_exists("0"));' => bool(false)
# NOT falsifiable by a plausible future minor: the claim is only "never "" nor "0"",
# and a future PHP would have to introduce a type keyword or permit a class name that
# is the single character "0" to break it. A stronger enum-ish claim (OneOf over the
# fixed keywords) is REFUSED here because the class-name arm is open-ended by design.

[[function]]
name = "get_debug_type"
refinement = "non-falsy-string"
return_type = "string"
confidence = "verified-probe"
probe = "get_debug_type(\"\")=string; get_debug_type(\"0\")=string; get_debug_type(null)=null; get_debug_type([])=array; get_debug_type(new class{})=class@anonymous; enum E{case A;} get_debug_type(E::A)=E (len 1, shortest observed); get_debug_type($closedRes)=resource (closed). Always a type keyword (>=3 chars) or a class name; PHP's label grammar forbids a leading digit so \"0\" is not nameable (class_exists(\"0\")===false). Never \"\" nor \"0\" for any input ⇒ non-falsy."

[[function]]
name = "spl_object_hash"
refinement = "non-falsy-string"
return_type = "string"
confidence = "verified-probe"
probe = "spl_object_hash(new stdClass)=00000000000000020000000000000000 (32 lowercase hex chars); 5000-object sweep gave distinct lengths=32, allhex=true, alllowercase=true, anyfalsy=false. The parameter is typed `object`, so there is no empty-in path (the bin2hex trap is unreachable). Never \"\" nor \"0\" ⇒ non-falsy for any argument."

# ─────────────────────── R4 refused rows ───────────────────────
# bin2hex        rt=string  — REFUSED: bin2hex("")==="" (probe: bin2hex("")=[] empty).
#                             ARGUMENT-SENSITIVE (empty in ⇒ empty out); a
#                             non-empty/non-falsy row would be a WRONG premise for
#                             bin2hex("") — the ADR's named FP channel. Refused.
# sha1_file      rt=string|false — REFUSED: multi-base envelope (the |false is an
#                             environmental failure arm, ADR-0042). No single-Fact
#                             seed; envelope_fact() returns None already.
# strtoupper     rt=string  — REFUSED: strtoupper("")=="" (probe: strtoupper("")=[]).
# strtolower     rt=string  — REFUSED: same empty-in/empty-out shape.
# trim           rt=string  — REFUSED: trim("  ")=="" AND trim("0")=="0" (probe:
#                             trim("  ")=[] , trim("0")=[0]). No refinement — neither
#                             non-empty (all-whitespace in) nor non-falsy ("0" out)
#                             holds for all args. Comment-refused to preempt a wrong row.

# ─────────────────────── DR4 refused rows ───────────────────────
# dirname        rt=string  — REFUSED TWICE. The DR4 census proposed `non-falsy-string`
#                             on the reasoning that dirname never returns "" and that
#                             dirname("0") returns "." — both legs are WRONG, and each
#                             failure is independently fatal.
#
#   (a) non-falsy-string is FALSE. A path segment may itself be the single character
#       "0", and dirname returns that segment verbatim — a FALSY string:
#         php -r 'var_export(dirname("0/x"));'   => '0'      (falsy, len 1)
#         php -r 'var_export(dirname("0//x"));'  => '0'
#         php -r 'var_export(dirname("0/a/b", 2));' => '0'   (the $levels form too)
#       The census's `dirname("0")` observation was a true but IRRELEVANT probe:
#       dirname("0")==="." only because "0" is a bare basename with no directory part.
#       The counterexample needs "0" in DIRECTORY position, not basename position.
#
#   (b) non-empty-string is ALSO FALSE — the fallback claim does not survive either.
#       dirname of the empty string is the empty string, the exact bin2hex
#       empty-in/empty-out shape:
#         php -r 'var_export(dirname(""));'      => ''       (empty, len 0)
#         php -r 'var_export(dirname("", 1));'   => ''       ($levels form too)
#
#       Supporting probes that do NOT rescue a claim (recorded so the refusal is not
#       re-litigated): dirname("/")='/'  dirname(".")='.'  dirname("a")='.'
#       dirname("..")='.'  dirname("//")='/'  dirname("///")='/'  dirname("0/")='.'
#       dirname("00/x")='00'  dirname("0/0/x")='0/0'  dirname("日本/x")='日本'
#       dirname("x/0")='x'  dirname(" /x")=' '  dirname("a/b/c",99)='.'
#       dirname("/a/b",5)='/'. Windows-style separators are NOT separators on this
#       runtime (PHP_OS_FAMILY=Darwin, DIRECTORY_SEPARATOR=/), so
#       dirname("C:\foo\bar")='.' — the platform-dependence is itself a reason not
#       to curate a path-shape refinement from one OS's answers.
#
#       So NO StrPreds refinement holds for all arguments: not NON_FALSY (a),
#       not NON_EMPTY (b). The reflected `string` envelope stands alone, which the
#       envelope machinery already seeds without a row. Refused — a row here would
#       be a WRONG premise for dirname("0/x") and dirname(""), the ADR's named FP
#       channel (a curated fact "disproving" a correct docblock).

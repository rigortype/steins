[counts]
# internal_functions  what the build had, before any filtering
# rows                names kept with their full parameter facts
# hazardous           of those, the ones carrying by-ref/callable/variadic
# plain               names mined and recorded as carrying nothing
# catalog_absent      names the catalog knows and this build does not have
internal_functions = 2192
rows = 257
hazardous = 197
plain = 1935
catalog_absent = 0


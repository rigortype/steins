# Builtin PER-PARAMETER FACTS — the independent source `out_params` and
# `invocation_shape` are checked against (issue #382).
#
# SOURCE OF RECORD. Generated by `cargo xtask mine-param-facts`, which runs
# `mine_param_facts.php` against the resident engine and reads every internal
# function's own arginfo through `ReflectionFunction`. Regenerate alongside a
# `PINNED_PHP` bump, the way `hierarchy.toml` is — never by hand.
#
# WHY THE ENGINE AND NOT THE STUBS: the two tables this checks were transcribed
# from php-src's stubs by hand, and a second transcription of the same stubs
# would agree with them wherever they are wrong. Arginfo is what PHP dispatches
# on.
#
# SCOPE. Every internal function of the build named in `[meta]`. A name with a
# by-ref, declared-callable or variadic position gets a full row; so does every
# name on the folding allowlist, hazard or not. Everything else is a name in
# `[plain] names`, and that list is load-bearing: a completeness test that read
# absence as agreement is the vacuity this table was built to remove.
#
# A `callable` position is one whose DECLARED type admits a callable. It is a
# sound marker, not a complete one: `array_udiff` takes its comparator at a
# variadic `mixed` tail, and `preg_replace_callback_array` takes its callables
# as array VALUES. Both are caught here by their other hazards (variadic,
# by-ref), which is why the fold-side rule reads all three columns.

[meta]
php = "8.5.9"
miner = "docs/research/phpsrc-mining/mine_param_facts.php"
generator = "cargo xtask mine-param-facts"
extensions = [

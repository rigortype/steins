# EFFECT_EXPECTED: the fp-gate's per-package baselines for the `effect.*`
# contract ids, built into `cargo xtask fp-gate` by `xtask/src/gate.rs`. One
# row per corpus package or local project, `"<name>" = <expected count>`; a
# name with no row expects zero. A row's triage note is the comment block
# directly above it.
#
# Rows for private-corpus projects (the `corpus.local.toml` projects whose code
# is not public) do not live here: they are in the gitignored
# `fp-gate.local.toml` at the repository root, which the gate merges in
# (`xtask/src/gate/ledger.rs`). `phpstan/phpstan-src` is listed in
# `corpus.local.toml` too but is public code, so its rows stay here.
#
# Permanent gate policy for the `effect.*` **contract** ids
# (`effect.envelope-exceeded`, `effect.liskov-widened`, and since issue #311
# `effect.interop-unknown-label`), the ADR-0050 §9 recorded delta: these gate as
# the same per-package **increase** tripwire as [`PHPDOC_EXPECTED`] /
# [`THROW_EXPECTED`], matching their declared-contract semantics (a proven
# behavior exceeds an envelope the code *declares* about itself; it still runs).
#
# Seeded **empty** in 2026-08, on the reading that no ADR-0006 envelope exists in
# the corpus. The reading was about *Steins* annotations: all three ids fire on
# upstream's spellings too — `@phpstan-impure` since #311, and the envelope pair
# since #303 taught the scanner `@phpstan-all-methods-pure` — so "no envelopes in
# the corpus" stopped being true the day it was read for upstream's vocabulary.

# Registered 2026-10-02 (issue #915, ADR-0100): `effect.maybe-envelope-exceeded`, the
# strict-floor sibling of `effect.envelope-exceeded`, joins the family. It is 0 on every
# public package. PHPStan's own `src/` has one, measured locally under PHP 8.5 with the
# `src` + `vendor` scoping (CI does not measure this project): `return $this->unsealed;` in
# `@phpstan-pure` `ConstantArrayType::getUnsealedTypes()`
# (`src/Type/Constant/ConstantArrayType.php:225:10`), kind `operator-magic-property`. A
# property read through a non-final `$this` is a MagicProp gap in the exhaustiveness bit
# (ADR-0099 §4.4), and the floor reports it as it should; whether a declared property read
# on `$this` ought to stay a gap is a separate precision question.
"phpstan/phpstan-src" = 1

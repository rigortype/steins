# THROW_EXPECTED: the fp-gate's per-package baselines for the `throw.*` ids,
# built into `cargo xtask fp-gate` by `xtask/src/gate.rs`. One row per corpus
# package or local project, `"<name>" = <expected count>`; a name with no row
# expects zero. A row's triage note is the comment block directly above it.
#
# Rows for private-corpus projects (the `corpus.local.toml` projects whose code
# is not public) do not live here: they are in the gitignored
# `fp-gate.local.toml` at the repository root, which the gate merges in
# (`xtask/src/gate/ledger.rs`). `phpstan/phpstan-src` is listed in
# `corpus.local.toml` too but is public code, so its rows stay here.
#
# Permanent gate policy for `throw.*` findings (ADR-0040/0007), identical in
# spirit to [`PHPDOC_EXPECTED`]: an undeclared **checked** throw escaping a
# written `@throws`, or a Liskov-widened override, is a contract-layer claim
# about the code's own documentation, not a runtime-breakage proof. Such
# findings saturate working code (the checked-exception volume ADR-0007 keeps
# quiet by default), so they are held in measurement mode and gate only as a
# per-package **increase** tripwire. Packages absent expect **zero**.
#
# Seeded from the first landing run of the throw system (ADR-0040); the monorepo
# count is dominated by two pervasive base exceptions thrown far below
# `@throws`-annotated controllers. It rose 35614 → 43963 with the closure wave
# (ADR-0033), which propagates throws through higher-order-builtin callbacks and
# body-local `$fn()` closures that were previously opaque taints — triaged
# 5-sample, every one a TRUE undeclared checked throw through a real callback
# edge, with the by-ref-invalidation guard keeping `$fn()` resolution sound.

# Reconciled to actual after closure-wave Stage D (interface/parent `@throws`
# Liskov + `implements` lowering): the increases are new `throw.liskov-widened`
# (phpunit +4, pxxxx +1 — an override declaring a narrower exception than the
# abstraction it implements), and the decreases (symfony/console 12→10, nikic
# 2→1) are `undeclared` counts that fell because lowering `implements` enriched
# the class chain, letting subtype/absorption checks resolve where they widened.

# Ratcheted down 2026-10-01 (issue #852): `throw_subtype` walked `extends` only,
# so a `@throws` or `catch` naming an interface the thrown class implements was a
# manufactured `No`. Walking the whole supertype graph removed 55 findings, all
# triaged FALSE, none added: phpunit 84 → 32 (52: `XmlException` under a declared
# `\PHPUnit\Util\Exception`, Runner/MockObject/Phpt marker interfaces, a
# `SkippedTest` covering `SkippedWithMessageException`), flysystem 3 → 0
# (`FtpConnectionException` implementors). Every other package unchanged.

# Raised 2026-10-01 (issue #849): `new C(...)` now carries its constructor's
# throws, so a throw raised in a constructor reaches the function that
# instantiates the class. +6, triaged: composer 91 → 94 (2 TRUE —
# `new PlatformRepository(...)` throws `\UnexpectedValueException` past
# `RequireCommand::execute()`'s `@throws ParsingException`; 1 the same shape as
# nine findings already counted here — `Exception` rethrown by `Silencer::call`
# reaching `Factory::createComposer()` through `new HttpDownloader`), console
# 10 → 13 (3 TRUE — `TerminalInputHelper`'s constructor throws the global
# `\RuntimeException` where `QuestionHelper::ask`/`doAsk`/`getHiddenResponse`
# declare and catch only Symfony's own). The one FALSE the change first showed
# (phpunit, an interface catch) was #852's bug, fixed before this landed. The
# composer row had read 93 against a measured 91 (CI and local alike) since an
# earlier, unrecorded drop; it is reset to the measured count plus the three.

# Raised 2026-10-02 (issue #915, ADR-0100): `throw.maybe-undeclared`, the strict-floor
# sibling of `throw.undeclared`, joins the family. It is a gap report, not a proof:
# one finding per site and gap kind inside a declaration that spells `@throws`, plus
# one per call into a project function that is itself `...?` and declares none. The
# gate counts every emitted id regardless of profile, so the rows below are the old
# `throw.undeclared` + `throw.liskov-widened` count plus the sibling's. Measured with
# the CI engine posture (PHP 8.4.25), and cross-checked with `steins check --profile
# strict --no-php --vendor-diagnostics` (the throw lane does not read the sidecar, so
# the two agree). The sibling alone, by package, as direct + inherited:
#   composer/composer          3374 = 3119 + 255
#   sebastianbergmann/phpunit  3194 = 2688 + 506
#   symfony/console             537 =  494 +  43
#   guzzle/guzzle               249 =  213 +  36
#   Seldaek/monolog             174 =  163 +  11
#   symfony/process             143 =  126 +  17
#   briannesbitt/Carbon         440 =  431 +   9
#   cakephp/chronos              50 =   50 +   0
#   thephpleague/flysystem       37 =   26 +  11
#   nikic/PHP-Parser              4 =    3 +   1        (8,202 in all: 7,313 + 889)
# Triaged by gap kind over the public corpus (direct findings): dynamic-callee 2,320
# (a `$f()` or `$o->$m()` the lane cannot name; phpunit's 1,185 are almost all test
# doubles and callbacks), operator-array-access 954 and operator-to-string 631 and
# operator-magic-property 564 (an untyped or non-final operand that may run user code,
# ADR-0099 §4.3), declared-receiver 737 (an injected collaborator typed to an
# interface or non-final class, ADR-0067), user-code-reach 711 (a builtin's argument
# that may reach `__toString` or a callback), unknown-class 397, non-final-this 359,
# no-throw-row 349 (a catalog name with no audited throw row; `#881` audits the table),
# operator-iteration 226, unresolved-throw 38, unknown-function 12, flag-dependent-throw
# 7, method-not-found 3, operator-clone 3, unseen-code 2. Every kind is a TRUE gap in
# the sense the id claims: the analyzer cannot bound what the site throws. Whether a
# given site can in fact throw is not what is asserted, which is why the id sits at
# `strict`, and why 81% of the corpus' `@throws` declarations carry at least one. The
# `throw.undeclared` and `throw.liskov-widened` counts underneath are unchanged:
# composer 94, phpunit 32, console 13, monolog 7, guzzle 2, nikic 1.
# `phpstan/phpstan-src`'s row, further down, predates the sibling: that checkout is only
# in `corpus.local.toml`, so it is reseeded from a run that has it.

"composer/composer" = 3468
"sebastianbergmann/phpunit" = 3226
"guzzle/guzzle" = 251
"Seldaek/monolog" = 181
"symfony/console" = 550
"nikic/PHP-Parser" = 5
"symfony/process" = 143
"briannesbitt/Carbon" = 440
"cakephp/chronos" = 50
"thephpleague/flysystem" = 37

# Registered 2026-07-24 (v0.1.0 run, oracle idea A): PHPStan's own `src/` as a
# local project. First run 0 proof-layer / 0 phpdoc.* / 20 throw.undeclared,
# triaged verbatim — homogeneous checked-exception debt (a `ShouldNotHappen`
# escaping a narrower `@throws`), the exact ADR-0040/0007 pattern tripwire mode
# exists for.
#   20 → 21  2026-07-26, the checkout advanced (192 src/ files). One rewritten
#            extension grew a second `ShouldNotHappenException` escaping a caller
#            declaring something else. Triaged against the pre-advance tree: that
#            file held one before and two now, the other 20 unchanged in file,
#            line and escaping method — a transitive catch, which is what the
#            damming machinery is for.
#   2026-08-08 (#186): scope moved from an `exclude` denylist to the positive
#            `paths = ["src", "vendor"]` key — PHPStan's `tests/` is that
#            project's own rule-fixture corpus, INPUTS written to be broken, so
#            outside a gate whose bar is zero FPs on working code (ADR-0079 §2.3
#            applied to a whole tree). Re-measured unchanged at 21 / 0, because
#            the denylist already named the same directories. The key buys
#            enforcement: an allowlist cannot silently readmit a fixture tree
#            added later, a denylist can.
"phpstan/phpstan-src" = 21

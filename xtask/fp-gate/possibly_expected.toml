# Triage of the `throw.maybe-undeclared` that issue #882's precision slice (S6c) moves, 2026-10-03
# (ADR-0100's amendment of that date), over the ten public packages, measured as `steins check
# --profile strict --no-php --vendor-diagnostics --no-cache` on the merge base and on the head,
# the four changes taken one at a time (8,122 findings on the base, 8,104 on the head): (a) an
# anonymous class lists its parent in the destructor closure only when its own body declares a
# destructor or imports a trait that may (the form (d) widens): -92 (phpunit 84, console 8; 607 drop sites go: phpunit's
# `Constraint`, `Operator` and `Printer` trees, which its tests subclass anonymously, and
# flysystem's adapters); (b) a class imports a trait into the closure only when the trait
# declares or aliases a destructor, transitively, or cannot be read, and a trait's typed
# properties are read off their hints: -14 (composer 5, phpunit 4, Carbon 4, guzzle 1; 1,117 more
# drop sites go, Carbon's `Date` users above all with 640, which (c) brings back through the
# `TranslatorInterface` property a trait imports, a name this checkout lacks); (c) a class no
# file declares and the engine does not, as a parent, a parameter or property hint or an imported
# trait, may declare one: +61 (composer 27, guzzle 19, phpunit 11, monolog 3, console 1; 2,774
# drop sites, 1,156 of them a hint, 1,604 a `new` of a declared class whose chain or properties
# reach a name nothing here declares; 1,873 of the 2,774 sit in a test directory, and all but 76
# functions were already `…?` for another reason). A `new` of a class no file declares is left to
# the unknown-class gap it records already, which kept 1,510 sites out. (c) is the incompleteness
# of a checkout with no `vendor/` (PSR types, Symfony contracts): with the tree indexed the names
# resolve and the rule reads as it does for any class; (d) the review of #1006 seeds the
# closure from every class that reaches a destructor, an anonymous class by its parent's chain,
# its imports and its properties, a named class by the typed properties it declares or imports
# from a trait (`self` and `parent` hints in a trait read the importing class and its parent),
# so a bound parent or interface of such a class is a gap: +27 (console 17, phpunit 6, Carbon 4;
# 825 drop sites, 750 of them a body's end, 403 a parameter's hint, 341 a `new` of a class whose
# chain reaches a holder, 504 in a test directory). Over the whole change 89 functions stop
# being effect-exhaustive and 55 become so (the changes one at a time: (a) 53 gained, (b) 11
# gained, (c) 76 lost, (d) 22 lost); the findings go from 8,122 to 8,104.
# `phpstan/phpstan-src` has no public checkout here: its row is the local fp-gate's of the
# previous head and is not remeasured for (d).

# Triage of the `throw.maybe-undeclared` that issue #1003's widening of the drop subjects (S6d) moves,
# 2026-10-03 (ADR-0100's amendment of that date), over the ten public packages, measured as `steins
# check --profile strict --no-php --vendor-diagnostics --no-cache` on the merge base and on the head,
# the three groups taken one at a time: (1) a local is a subject by any write that stores a `new`, an
# untyped parameter overwritten with one included, and (2) a `new` an expression consumes is a
# temporary (`clone new D()`, `(new D())->p`, `echo new D()`, `new D() instanceof D`) move nothing here:
# no class a destructor reaches is written in those shapes in these packages; (3) a write to or an
# `unset` of a typed property whose declared hint reaches a destructor adds +34 (phpunit 21, guzzle 5,
# Carbon 4, monolog 2, console 2) and rewords 12 (the kind list of a callee gains `destructor`: phpunit
# 9, process 2, console 1), none disappears. Of the 34, 16 are the callers of one lazy-singleton write
# (`self::$instance = new self` in phpunit's `CodeCoverage::instance()`, hint `?self`), 14 are hints
# that name an interface or an exception class a class reaching a destructor implements or extends
# (guzzle `?ResponseInterface` and `?ResponseException` 5, Carbon `?CarbonInterface` 4, phpunit's rule and exception properties
# 5), 2 are monolog's constructor writes after `parent::__construct()` over a class this checkout
# lacks, and 2 are console's `?InvokableCommand`. No function changes exhaustiveness here (a method
# that writes a property is already `…?` for `state-construct`; a constructor's second write or a
# write after a use of `$this` flips it, which none of these packages has), `effect-diff` reports no
# event and the three `transform` dry-runs plan the same edits. The 8,016 findings of the base go to 8,050.
# `phpstan/phpstan-src` is not remeasured here: the local fp-gate decides its row.


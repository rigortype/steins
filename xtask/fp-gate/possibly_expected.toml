# POSSIBLY_EXPECTED: the fp-gate's per-package baselines for the
# possibly-grade proof ids, built into `cargo xtask fp-gate` by
# `xtask/src/gate.rs`. One row per corpus package or local project,
# `"<name>" = <expected count>`; a name with no row expects zero. A row's
# triage note is the comment block directly above it.
#
# Rows for private-corpus projects (the `corpus.local.toml` projects whose code
# is not public) do not live here: they are in the gitignored
# `fp-gate.local.toml` at the repository root, which the gate merges in
# (`xtask/src/gate/ledger.rs`). `phpstan/phpstan-src` is listed in
# `corpus.local.toml` too but is public code, so its rows stay here.
#
# Permanent gate policy for the **possibly-grade** ids (ADR-0081 §8): every id
# registered at the `strict` floor, whichever layer it sits in, selected by floor rather
# than by name (see [`gate_bucket`]): the proof-layer `variable.maybe-undefined`,
# `property.maybe-undefined`, `type.return-maybe-missing`, `type.maybe-*-mismatch`, and
# the contract-layer `phpdoc.maybe-*`, `offset.maybe-missing`, and (ADR-0100, issue #915)
# `effect.maybe-envelope-exceeded` and `throw.maybe-undeclared`. The family tables
# (PHPDOC/THROW/EFFECT_EXPECTED) hold the definite ids only. One table holds all of
# them; a per-id split is what issue #922 still has open. Same per-package **increase** tripwire as
# [`PHPDOC_EXPECTED`] / [`THROW_EXPECTED`] / [`EFFECT_EXPECTED`]; absent = zero.
#
# A count and not per-finding pins, because a possibly-grade id claims only that
# *a* path reaches the site — the shape defensive house styles produce on purpose,
# and why the registry floors these at `strict`. Pinning each would have meant
# hundreds of rows asserting that working code works. (A definite proof id claims
# the program breaks, so its count belongs at zero with each exception triaged
# into [`EXPECTED_PROOF_FINDINGS`].)
#
# Seeded 2026-08-09 from the binding-presence run, at the revisions
# `corpus.lock.toml` / `corpus.local.toml` record. The five classes that triage
# found, so a reader knows what a count is made of:
#
# 1. **Conditional binding** (`if`/`elseif` with no `else`) — TRUE, the id's point.
# 2. **A loop variable read after its loop** — TRUE; the zero-iteration path
#    really does reach it unbound.
# 3. **Correlated conditions** — bound under `if (count($c) > 1)` and read under a
#    textually identical one whose body reassigns `$c` between. TRUE under the
#    syntactic reading this id is defined over; proving the conditions agree is
#    path feasibility, which nothing here attempts.
# 4. **A never-returning callee** (`$this->fail()`, `markTestSkipped()`) — FALSE.
#    `stmt_end` reads a statement-position call as falling through because
#    deciding otherwise needs the project index; ADR-0081 §9 defers the refinement
#    to the emitter side, where the index lives.
#
#    **Half of this class closed, 2026-09-01 (issue #599 leg 1), and the split is
#    worth naming**: one symptom, two seams. A `type.maybe-*` row is a WALK
#    finding, and the walk holds the index, so a statement-position call to a
#    resolved native `: never` callee terminates its branch there now and those
#    rows are gone. A `variable.maybe-undefined` row is not: its firing set is
#    `Scope::maybe_undefined_reads`, and `stmt_end` — quoted above — belongs to
#    the binding-presence pass, which runs at lowering and is index-free by
#    ADR-0081 §1. §9's deferral therefore still stands for exactly the rows it
#    was written about, and discharging it still means what §9 says it means:
#    publishing enough branch structure for `check_undefined_variables` to
#    re-subtract an arm after the fact.
# 5. **A binding in an argument of a throwing call inside `try`** — FALSE. PHP
#    evaluates arguments before entering the callee, so the binding is done before
#    anything can throw; the pass weakens at statement granularity.
# 6. **A builtin's `T|false`/`T|null` into a native `T`**
#    (`type.maybe-argument-mismatch`, issue #391) — TRUE, and the first class in
#    this bucket that is not a binding claim: the argument's own declared type
#    has an arm the parameter rejects. Only the all-`Verified` half lands here;
#    an `Asserted` arm routes the same judgment to `phpdoc.maybe-argument-mismatch`
#    and thus to [`PHPDOC_EXPECTED`].

# Triage of `throw.maybe-undeclared` by gap kind, 2026-10-02 (issue #915, ADR-0100), over the
# ten public packages (8,202 findings in all, 7,313 direct and 889 inherited; the per-package
# split, direct + inherited: composer 3374 = 3119 + 255, phpunit 3194 = 2688 + 506, console
# 537 = 494 + 43, guzzle 249 = 213 + 36, monolog 174 = 163 + 11, process 143 = 126 + 17,
# Carbon 440 = 431 + 9, chronos 50 = 50 + 0, flysystem 37 = 26 + 11, PHP-Parser 4 = 3 + 1).
# Direct findings by kind: dynamic-callee 2,320 (a `$f()` or `$o->$m()` the lane cannot name;
# phpunit's 1,185 are almost all test doubles and callbacks), operator-array-access 954 and
# operator-to-string 631 and operator-magic-property 564 (an untyped or non-final operand that
# may run user code, ADR-0099 §4.3), declared-receiver 737 (an injected collaborator typed to
# an interface or non-final class, ADR-0067), user-code-reach 711 (a builtin's argument that
# may reach `__toString` or a callback), unknown-class 397, non-final-this 359, no-throw-row
# 349 (a catalog name with no audited throw row; #881 audits the table), operator-iteration
# 226, unresolved-throw 38, unknown-function 12, flag-dependent-throw 7, method-not-found 3,
# operator-clone 3, unseen-code 2. Every kind is a TRUE gap in the sense the id claims: the
# analyzer cannot bound what the site throws. Whether a given site can in fact throw is not
# what is asserted, which is why the id sits at `strict`, and why 81% of the corpus' `@throws`
# declarations carry at least one. `effect.maybe-envelope-exceeded` is 0 on every public
# package. These counts are with the CI engine posture (PHP 8.4.25) and agree with
# `steins check --profile strict --no-php --vendor-diagnostics` to the finding.


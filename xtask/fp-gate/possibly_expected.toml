# Triage of the `throw.maybe-undeclared` that issue #882 adds, 2026-10-03 (ADR-0100's amendment of
# that date, slice S6b), over the ten public packages: +126 findings in five of them (phpunit 107,
# console 8, composer 5, Carbon 4, guzzle 2), none removed, and 248 more whose kind list grew by
# `destructor` without a count change (phpunit 244, composer 2, guzzle 2). Of the 126, 114 sit at a

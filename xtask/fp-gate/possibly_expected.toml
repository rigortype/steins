# literal strict flag removes, 2026-10-03 (issues #860 and #991, ADR-0101 §3.8, slice S3), over the
# ten public packages: -79 findings in seven of them (phpunit 37, composer 30, console 4, process 3,
# monolog 2, guzzle 2, Carbon 1), none added, and 8 more reworded because `user-code-reach` left their
# kind list (composer 6, monolog 1, console 1). Every one is a site whose only unbounded kind was
# `user-code-reach`: 61 at an `in_array` or `array_search` with a literal `true` (identity, so no
# `__toString` runs: phpunit 30, composer 22, console 4, monolog 2, Carbon 1, guzzle 1, process 1), 11
# at a printf call whose literal format reaches no value (a `%d`-only format over an untyped
# argument: phpunit 7, composer 2, process 2) and 7 at the call of a function that lost the kind
# inside (composer 6, guzzle 1), plus the 8 reworded. Each is the call-site proof the finding's own
# text asked for (`a call the site does not rule out`), so none is a regression and none a drop of
# soundness; no other id moves, and `effect.maybe-envelope-exceeded` stays 0 on the public packages.
# The setting reads this slice adds move no row here: a proven locale read (a literal `%f`, `%g` or `%G`)
# sits on summaries that were already `…?`, and a `%s` of a value not shown to be a float or a format that
# is not a literal is the effect-lane gap `value-dependent-read` (ADR-0101 §3.2), which no public package
# declares an envelope over, so `effect.maybe-envelope-exceeded` stays 0; `transform effects-envelope`
# writes no `@phpstan-impure` tag for them. Counts
# agree with `steins check --profile strict --no-php --vendor-diagnostics` base and head, and with the
# local fp-gate (PHP 8.5.11) base and head. `phpstan/phpstan-src`, public code at the revision

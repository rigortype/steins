# Dev tooling — the cargo-xtask pattern (ADR-0013/0021 verification apparatus).
#
# Invoked as `cargo xtask <command>` (alias in .cargo/config.toml). It depends on
# the analysis crates as LIBRARIES (never shells out to the `steins` binary) so it
# reads parse errors and call data straight off `SourceTree` and runs the salsa
# proof-layer pipeline directly. Not a dependency of any shipped crate.
[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
steins-syntax = { path = "../crates/steins-syntax" }
steins-db = { path = "../crates/steins-db" }
steins-infer = { path = "../crates/steins-infer" }
steins-phpdoc = { path = "../crates/steins-phpdoc" }
# The acceptance relation, for `nsrt`'s subsumption verdict (issue #47): the
# harness must judge "narrower than" with the SAME relation the checker enforces
# (`normalize::subsumes`), not a second harness-local definition that would drift.
steins-contract = { path = "../crates/steins-contract" }
# The value-domain bases and the real PHP sidecar, for `mine-function-map`
# (issue #73): the declared-envelope floor's rows are filtered through the SAME
# lowering the analyzer uses and countersigned by the SAME engine transport, so
# the generator can never admit a row the seam would drop or the runtime disowns.
steins-domain = { path = "../crates/steins-domain" }
steins-sidecar = { path = "../crates/steins-sidecar" }
# The folding allowlist, for `mine-param-facts` (issue #382): the names the
# catalog reasons about are kept in the mined table even when they carry no
# hazard, so "this name was mined and carries nothing" is a recorded fact rather
# than an absence a completeness test would read as agreement.
steins-catalog = { path = "../crates/steins-catalog" }

rayon.workspace = true
toml.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true

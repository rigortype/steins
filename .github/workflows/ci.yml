# Continuous integration — every push to master and every pull request, except
# Markdown-only changes (see `paths-ignore` below, and its THIRD-PARTY-LICENSES.md
# carve-out).
#
# The gates, and why each one is here:
#
#   test      clippy + workspace tests + a release build, on Linux always and
#              macOS conditionally (see the `if:` on the `test` job below).
#              Both OSes matter because both ship as release binaries and
#              because the PHP sidecar (ADR-0004/0024) spawns a real `php`
#              over a temp-dir path — the one part of Steins whose behaviour
#              is genuinely OS-shaped. macOS runs are just not on the PR
#              iteration loop's critical path; see the job comment.
#   docs      rustdoc with `-D warnings`: intra-doc links across a 10-crate
#             workspace rot silently, and the ADR-heavy doc comments are the
#             navigation layer.
#   licenses  the relicensing gate (ADR-0025 / deny.toml's header) plus the
#             THIRD-PARTY-LICENSES.md drift guard — a binary-only distribution
#             carries its dependencies' notices, so a stale file is a compliance
#             bug, not a cosmetic one.
#   fp-gate   the zero-false-positive bar over the corpus (ADR-0013/0026).
#
# One gate lives outside this file: `lean.yml` builds the Lean 4 specification of
# the value domain and checks its committed vectors (ADR-0059). It is separate
# because `on.paths` is a workflow-level filter and it only has something to say
# when the spec or `crates/steins-domain/` changes. The Rust half of that loop —
# `crates/steins-domain/tests/lean_vectors.rs` — needs no Lean and runs in `test`
# below, on every PR.
#
# `cargo fmt --check` is deliberately NOT a gate — the tree is hand-formatted and
# a fmt run would rewrite 110 files. That policy, with its numbers, is recorded
# in rustfmt.toml; clippy `-D warnings` is the blocking style gate instead.
#
# The toolchain is pinned to the DECLARED MSRV (`rust-version` in Cargo.toml),
# not `stable`: the floor is a promise to anyone installing with `cargo install
# --git`, and an unpinned CI silently lets code land that the floor cannot build.
# The cost is that a regression from a *newer* stable is not caught here; when
# stable moves meaningfully past the floor, add a second non-blocking matrix row
# rather than unpinning this one.
name: CI

on:
  push:
    branches: [master]
    # Markdown-only changes (README, CHANGELOG, ADRs, ...) touch none of the
    # gates below — except THIRD-PARTY-LICENSES.md, which is both what
    # `licenses` checks for drift AND embedded into the `steins-cli` binary via
    # `include_str!` (crates/steins-cli/src/main.rs), so it has to keep
    # triggering a real build. The `!` line re-includes it; order matters, and
    # it must come after the blanket ignore. NB: duplicated verbatim on
    # `pull_request` below — GitHub's workflow parser does not honour YAML
    # anchors (see composer.yml), so an anchor here would silently widen scope.
    paths-ignore:
      - "**.md"
      - "!THIRD-PARTY-LICENSES.md"
  pull_request:
    paths-ignore:
      - "**.md"
      - "!THIRD-PARTY-LICENSES.md"
  # Manual escape hatch: GitHub webhook->Actions delivery dropped this branch's
  # events across three outage windows (2026-08-08); dispatch bypasses the webhook.
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep in lockstep with `rust-version` in Cargo.toml and `msrv` in clippy.toml.
  RUST_MSRV: "1.97"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # One OS failing should still report the other — an OS-specific sidecar
      # break is exactly the signal this matrix exists to isolate.
      fail-fast: false
      matrix:
        # macOS is slow (the matrix's long pole) and PR iteration is a tight
        # loop, so it's left out of the matrix entirely on `pull_request` and
        # only included on push to master / the workflow_dispatch escape hatch
        # above. Every push to master (and every release, cut from master)
        # still runs it, so an OS-specific sidecar break is caught before it
        # ships — just not on every PR round-trip.
        #
        # This has to live here rather than as a job-level `if: matrix.os !=
        # ...` — the `matrix` context isn't available in `jobs.<id>.if` (only
        # github/inputs/needs/vars are; actionlint catches the mistake). It
        # IS available as an expression inside the matrix definition itself,
        # since only `github` (not `matrix`) is needed to compute it.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The sidecar discovers `php` on PATH; without it the suite runs in the
      # sound subset and the runtime-dependent tests never exercise the IPC path.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Install Rust toolchain (MSRV)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_MSRV }}
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # `--locked` everywhere: build against the committed Cargo.lock, so a run
      # is reproducible and an uncommitted lock update fails loudly here rather
      # than drifting into a release build.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      # Builds with the shipping `[profile.release]` (thin LTO, codegen-units=1,
      # stripped) — the same profile the release workflow packages, so profile
      # breakage surfaces on a PR and not at a tag.
      - name: Build (release)
        run: cargo build --release --locked

      # Liveness check on the produced binary, run from an empty directory so it
      # sees no project and no steins.toml. `doctor` is the right smoke test: it
      # runs no checks, exits 0 on a degraded environment by design (ADR-0054
      # §10), and is what the release workflow and the Homebrew formula assert.
      - name: Smoke test (doctor)
        shell: bash
        run: |
          set -euo pipefail
          bin="$PWD/target/release/steins"
          tmp="$(mktemp -d)"
          cd "$tmp"
          "$bin" doctor
          "$bin" doctor --no-php

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (MSRV)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_MSRV }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: docs

      # A CLEAN gate: one broken intra-doc link fails the run.
      #
      # This was a ratchet (the ADR-0022 baseline shape: accept the debt that
      # exists, refuse any more of it) over 18 broken links across 12 files —
      # unresolved paths, and public docs pointing at private items. The cap was
      # lowered as links were fixed, reached 0, and the ratchet retired itself
      # here as its comment said it should. Do not reintroduce a cap: fix the
      # link, or reword the reference to plain backticks when the target is
      # genuinely a private implementation detail or lives in a crate this one
      # does not depend on.
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --workspace --locked

  licenses:
    name: licenses
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (MSRV)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_MSRV }}

      - name: Install cargo-about + cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about,cargo-deny

      # Fails if any dependency's license falls outside deny.toml's allow list.
      # For Steins that list is permissive-only ON PURPOSE — a copyleft
      # dependency would silently foreclose the Apache-2.0/MPL-2.0 relicensing
      # options ADR-0025 keeps open until gate G3. See deny.toml's header.
      - name: License audit
        run: cargo deny check licenses

      # The committed notices must match the current dependency tree: the
      # release archives ship this file as the dependencies' required notice,
      # so drift means shipping an inaccurate legal document. Regenerate with
      # the command in the error message when this fails.
      - name: Third-party notices up to date
        run: |
          cargo xtask licenses
          git diff --exit-code -- THIRD-PARTY-LICENSES.md \
            || { echo "::error::THIRD-PARTY-LICENSES.md is stale — run: cargo xtask licenses"; exit 1; }

  fp-gate:
    name: fp-gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Install Rust toolchain (MSRV)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_MSRV }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: fp-gate

      - name: Cache corpus
        uses: actions/cache@v4
        with:
          path: corpus
          key: corpus-${{ hashFiles('corpus.lock.toml') }}

      - name: Sync corpus
        run: cargo run -p xtask -- corpus-sync

      - name: Run FP gate
        run: cargo run -p xtask -- fp-gate

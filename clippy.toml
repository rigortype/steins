# Clippy's suggestion-MSRV, pinned to the workspace's declared `rust-version`.
#
# Contributors and CI runners drift ahead of the floor (CI pins the toolchain to
# 1.97; a laptop may be on something newer). Without this, clippy proposes
# idioms stabilized after 1.97 and a developer who applies the suggestion
# silently raises the MSRV — the build then fails only for whoever is actually
# on the floor. Pinning it here makes clippy's advice and the declared floor the
# same number, so `-D warnings` stays green without churn and without drift.
#
# Keep this in lockstep with `rust-version` in Cargo.toml: raising the floor
# means raising both, in one commit, deliberately.
msrv = "1.97"

# The function-length ratchet (#778). `too_many_lines` warns in every crate
# through `[workspace.lints]` in Cargo.toml; clippy's count skips blank and
# comment-only lines. Each function that was over this line when the ratchet
# landed carries `#[expect(clippy::too_many_lines, reason = "…")]`. A new
# function over it fails `-D warnings`, and so does an `expect` on a function
# that has shrunk under it (`unfulfilled_lint_expectations`), so the marked set
# can only shrink. At 125 that set was 26 functions; 100 (clippy's default)
# would have marked 43, and 150 only 15.
#
# The count is clippy's own, so a toolchain bump can move a function that sits
# near the line: CI's clippy (the floor above) decides, and raising the floor
# adds or drops markers in the same commit.
too-many-lines-threshold = 125

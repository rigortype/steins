[package]
name = "steins-syntax"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# HARD RULE (ADR-0003): the Mago crates are dependencies of THIS crate only.
# No Mago type may appear in this crate's public API — everything below the fold
# is lowered into the owned, Mago-free representation exposed by `lib.rs`.
[dependencies]
# The value vocabulary (ADR-0080 §2.3): `PhpStr` is a domain type, and
# `steins-domain` carries no `steins-*` dependency of its own, so the edge is
# acyclic and adds no build surface.
steins-domain = { path = "../steins-domain" }
mago-syntax.workspace = true
mago-allocator.workspace = true
mago-span.workspace = true
mago-database.workspace = true
# `persist` only (ADR-0092 §2, issue #487): Serialize/Deserialize on the owned
# plain-data representation, so a generation's trace IR can be stored per file.
# Optional so the wasm build's dependency surface does not grow (ADR-0065).
serde = { workspace = true, optional = true }

[features]
# Serde derives on `SourceTree` and every plain-data type it carries — the
# trace-IR half of the per-package artifacts (ADR-0092 §2, issue #487). The
# derives change no semantics; the payload format is `steins-db`'s business.
persist = ["dep:serde", "steins-domain/persist"]

# The shipped crate: it produces the `steins` binary that the release workflow
# packages for every target. The distribution metadata below is inherited from
# `[workspace.package]` so the Homebrew formula's `desc`/`homepage` and the
# release notes have one source.
[package]
name = "steins-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
authors.workspace = true

[[bin]]
name = "steins"
path = "src/main.rs"

[dependencies]
# Doctor's reflected-class-world line (issue #269) asks the builtin catalog whether a
# referenced class already has a row before putting it to the engine — the same
# "catalog first, engine last" order the analysis uses.
steins-catalog = { path = "../steins-catalog" }
steins-db = { path = "../steins-db" }
# The generation store, for `doctor`'s store section (issue #525): doctor reads
# the published generation's own manifest rather than a second bookkeeping file,
# so what it reports cannot drift from what `check` wrote. Read-only —
# `Store::open_existing` creates nothing.
steins-gen = { path = "../steins-gen" }
steins-infer = { path = "../steins-infer" }
steins-syntax = { path = "../steins-syntax" }
steins-edit = { path = "../steins-edit" }
steins-phpdoc = { path = "../steins-phpdoc" }
steins-sidecar = { path = "../steins-sidecar" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

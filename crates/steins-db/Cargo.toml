[package]
name = "steins-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
salsa.workspace = true
steins-syntax = { path = "../steins-syntax" }
# The label registry the plugin channel extends (ADR-0068): plugin discovery has
# to judge a registration against the core taxonomy roots, which the catalog owns.
steins-catalog = { path = "../steins-catalog" }
# The partition vocabulary (ADR-0092 §3): `Package`/`PackageUniverse` are
# generation identity, so the types live in the leaf crate and this crate —
# where project discovery already lives — builds them from composer.lock.
steins-gen = { path = "../steins-gen" }
# The magic-member tag scan (ADR-0049 A14): the obstacle table is one of the
# per-package shard tables the generation merge recomputes, so the per-class
# scan lives beside the shard builder here.
steins-phpdoc = { path = "../steins-phpdoc" }
serde_json.workspace = true
# `persist` only (ADR-0092 §2, issue #487): the derives behind the per-package
# payload codec in `persist`.
serde = { workspace = true, optional = true }

[features]
# The per-package artifact payloads (ADR-0092 §2, issue #487): the `symbols`/
# `contracts`/`trace` section codecs, the read transaction, and the residency
# policy vocabulary. A feature — not unconditional — so the wasm module, which
# consumes this crate, keeps its dependency surface (ADR-0065): nothing in the
# playground persists.
persist = ["dep:serde", "steins-syntax/persist"]

[dev-dependencies]
# The self-dependency trick: enables `persist` for this crate's own test
# builds (CI runs `cargo test --workspace` with default features), without
# enabling it for any dependent — the wasm graph stays serde-derive-free.
steins-db = { path = ".", features = ["persist"] }

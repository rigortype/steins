[package]
name = "steins-infer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
steins-domain = { path = "../steins-domain" }
steins-contract = { path = "../steins-contract" }
salsa.workspace = true
steins-db = { path = "../steins-db" }
steins-syntax = { path = "../steins-syntax" }
steins-catalog = { path = "../steins-catalog" }
steins-phpdoc = { path = "../steins-phpdoc" }
# The sidecar dependency is UNCONDITIONAL as of ADR-0066. The process transport
# — the half that spawns the project's own PHP — is cfg-gated inside
# `steins-sidecar` itself, so `std::process` still never enters the wasm
# dependency graph (the ADR-0065 property, now enforced one crate lower down).
# What crosses to wasm is the wire format alone: the same `FoldArg`/`FoldResult`
# types and the same JSON codec, so the browser's replay transport (issue #64)
# cannot speak a dialect of the protocol.
steins-sidecar = { path = "../steins-sidecar" }
serde_json.workspace = true

# The persisted fold table (ADR-0092 §4) rides the steins-gen artifact
# container. Native-only, like the process transport it wraps: the browser's
# replay transport has no disk, and the wasm dependency graph stays free of
# the store's filesystem machinery. steins-gen stays a leaf crate — this edge
# points at it, never back.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
steins-gen = { path = "../steins-gen" }
# The generation orchestrator (ADR-0092 §5, issue #489) reads and writes the
# per-package payloads, so the native build turns steins-db's `persist` codecs
# on. Target-gated like steins-gen above: the wasm graph keeps its surface
# (ADR-0065) — nothing in the playground persists.
steins-db = { path = "../steins-db", features = ["persist"] }

[dev-dependencies]
steins-db = { path = "../steins-db" }
steins-syntax = { path = "../steins-syntax" }
steins-domain = { path = "../steins-domain" }
# The width classification the fold gate consults (issue #64 S1.5), so the gate
# tests can assert against the catalog's verdict rather than restate it.
steins-catalog = { path = "../steins-catalog" }

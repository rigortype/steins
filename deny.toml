# cargo-deny configuration — the license audit CI runs as `cargo deny check licenses`.
#
# WHY THIS GATE EXISTS, for Steins specifically. The core is Apache-2.0 (gate G3,
# ADR-0025). A copyleft dependency compiled into the release binary would impose
# its own terms on that binary as distributed — so the permissive Apache-2.0
# licence Steins states in `Cargo.toml`, in the Homebrew formula, and in every
# release archive would simply not be the licence users actually received.
#
# That makes this gate STRICTER in consequence than it was before the relicense,
# not looser. Under the old AGPL core a stray copyleft dependency merely closed
# off a future relicensing option; now it contradicts a promise already made, and
# it can arrive from a transitive bump nobody reviewed. The allow-list below is
# therefore permissive-only, and stays that way.
#
# The bundled notices themselves are generated separately by `cargo about` into
# THIRD-PARTY-LICENSES.md (see about.toml); this file decides what is ALLOWED,
# that one records what is SHIPPED.

# Audit the union of the published-binary platforms (same set as about.toml and
# the release matrix), so a license pulled in only on, say, Linux is still seen.
[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[licenses]
# Keep in sync with about.toml's `accepted`. Add a license here only after
# confirming a binary combining it with Apache-2.0 code may still be distributed
# under Apache-2.0 — i.e. it imposes no reciprocal source obligation and no term
# Apache-2.0 does not already satisfy. Weak-copyleft licences (MPL-2.0, LGPL) are
# NOT a middle ground to wave through casually: they attach file- or
# library-scoped obligations that a single statically linked binary cannot honour
# implicitly, so they need a deliberate decision, not an edit to this list.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    # Public-domain dedications. CC0-1.0 reaches us through `notify` (a
    # mago-database dependency) and `blake3`/`constant_time_eq`; Unicode-3.0 is
    # the data license `unicode-ident` carries alongside its MIT/Apache grant.
    "CC0-1.0",
    "Unicode-3.0",
]
confidence-threshold = 0.9

# The workspace's own crates are `publish = false`, and their licence is set in
# exactly one place — `[workspace.package] license` — and inherited by all eleven,
# so there is nothing here for this gate to catch. Skipping them keeps the
# allow-list's meaning single: it says what THIRD-PARTY code may be.
[licenses.private]
ignore = true

# The rev-pinned Mago fork (ADR-0003/0025) is the one non-crates.io source in
# the graph. Declaring it keeps a full `cargo deny check` from flagging it, and
# means an *undeclared* git dependency appearing later would be flagged.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/rigortype/mago"]

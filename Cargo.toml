# Steins — a PHP static analyzer in Rust (ADR-0016: greenfield).
#
# Workspace crate map:
#   steins-syntax   syntax-tree contract + Mago parser backend (ADR-0003)
#   steins-db       salsa demand-driven query database (ADR-0009)
#   steins-catalog  builtin/extension catalog (ADR-0014/0021) — stub
#   steins-gen      frozen-generation substrate: identity + artifact store (ADR-0092)
#   steins-infer    inference engine / proof-layer checks (ADR-0001/0002)
#   steins-sidecar  PHP sidecar IPC (ADR-0004/0024) — stub
#   steins-cli      the `steins` binary (ADR-0020)
#
# NB: spike/mago-spike is a standalone crate, deliberately NOT a member.
[workspace]
resolver = "3"
# `xtask/` is dev tooling (the cargo-xtask pattern): a workspace member so it
# builds and lints with everything else, but it ships nothing — invoked only as
# `cargo xtask <command>`. It is never a dependency of a shipped crate.
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.6"
edition = "2024"
rust-version = "1.97"
# Apache-2.0 core. This is the SETTLED outcome of roadmap gate G3 (ADR-0025):
# the sole copyright holder relicensed from AGPL-3.0-only before the first
# external contribution, which is the window in which that was still a
# unilateral decision. The MIT attributes package lives in its own repo
# (`rigortype/steins-attributes`) and is not a member here.
#
# Changing this again is no longer cheap: after external contributions land it
# requires every contributor's consent. Treat it as fixed, and see deny.toml —
# a copyleft dependency would now contradict a promise already made to users,
# not merely close off a future option.
license = "Apache-2.0"
authors = ["USAMI Kenta <tadsan@zonu.me>"]
repository = "https://github.com/rigortype/steins"
homepage = "https://github.com/rigortype/steins"
readme = "README.md"
description = "A value-precise static analyzer for PHP that reports only what provably breaks at runtime."
# NOT PUBLISHABLE TO crates.io, and not merely unpublished: the parser backend
# is the rev-pinned Mago fork (ADR-0003/0025), and crates.io rejects any crate
# with a `git` dependency. `publish = false` makes that a clear, early error
# instead of a confusing one at upload time. The distribution channels are the
# GitHub Release binaries and the Homebrew tap (.github/workflows/release.yml),
# plus `cargo install --git` from a checkout; see the `steins-release-prep`
# skill. Revisit only if the Mago fork's crates are ever published.
publish = false

# Release profile — shared by CI's release build and the artifacts the release
# workflow ships, so what is measured is what is distributed (one profile, no
# divergence). `lto = "thin"` + `codegen-units = 1` buys cross-crate inlining
# across the 10-crate pipeline for a CPU-bound analyzer; `strip = "symbols"`
# drops the debug symbol table from a binary that is downloaded, not debugged.
# `panic` is deliberately left at `unwind`: the CLI's exit-code contract
# (ADR-0050 §7) and the test suite both rely on unwinding.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.dependencies]
# Pinned Mago fork — the adopted parser backend (ADR-0003). These crates are a
# hard secret of steins-syntax: no other workspace crate may depend on them.
mago-syntax = { git = "https://github.com/rigortype/mago", rev = "237465ec7a36e22431da14935d9ec0fecad2d6a2" }
mago-allocator = { git = "https://github.com/rigortype/mago", rev = "237465ec7a36e22431da14935d9ec0fecad2d6a2" }
mago-span = { git = "https://github.com/rigortype/mago", rev = "237465ec7a36e22431da14935d9ec0fecad2d6a2" }
mago-database = { git = "https://github.com/rigortype/mago", rev = "237465ec7a36e22431da14935d9ec0fecad2d6a2" }

salsa = "0.28"
# Fingerprints in steins-gen (ADR-0092 §2). Already in the resolved graph via
# the mago fork (mago-reporting), so this entry pins no new license row.
blake3 = "1"
# The two copy-on-write clone syscalls steins-gen shares artifact bytes with
# (macOS `clonefile`, Linux `FICLONE`); std has neither. Already in the
# resolved graph through the mago fork, so this entry pins no new license row —
# the same reasoning as `blake3` above.
libc = "0.2"
serde = { version = "1", features = ["derive"] }
# `preserve_order` is load-bearing for the committed document shapes: `check
# --format json` and `--format sarif` both build a `serde_json::Value` and print
# it, so without it every object's keys come out alphabetized and the SARIF
# snapshot fixture (and the JSON document users read) reorder wholesale. The
# feature was already on through mago's `schemars`, i.e. by dependency accident;
# declaring it here is what keeps a mago bump from silently rewriting output.
serde_json = { version = "1", features = ["preserve_order"] }

# Dev-tooling dependencies (xtask only).
rayon = "1"
toml = "0.8"
semver = "1"
